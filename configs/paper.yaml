  base: 0.54
  rate: 5000
  landmark: 14.0
  horizon: 42.0
  delay: {kind: fixed, days: 14.0}
reconciliation:
  outcome: passes the month-end audit
  base: 0.70
  rate: 4500
  landmark: 9.0
  horizon: 42.0
  delay: {kind: calendar, lo: 2.0, hi: 32.0}
replication:
