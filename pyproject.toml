[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tenor"
version = "0.1.0"
description = "TENOR: valid evaluation of long-running agents from early surrogates and late outcomes"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Manav Agarwal", email = "manav@hanaml.com"}]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
paper = ["matplotlib>=3.7"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
tenor-demo = "tenor.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The report's generator and figure scripts are dense numerical code: compound statements are allowed there,
# and pyflakes still applies.
"paper/*" = ["E401", "E701", "E702", "E731", "E741", "B007", "B023", "B905", "UP"]
